# Profilo «atlante» per GPSLogger (https://github.com/mendhak/gpslogger)
# Si carica dall'Atlante di campo con il link gpslogger://properties/<indirizzo di questo file>.
# Tracce GPX 1.1, un punto ogni 5 secondi o 2 metri, solo GPS, scarta letture peggiori di 30 m,
# un file nuovo a ogni avvio, la registrazione parte da sola quando apri GPSLogger.
# by Lollo ®2026
log_gpx=true
log_gpx_11=true
log_kml=false
log_plain_text=false
log_geojson=false
log_nmea=false
log_customurl_enabled=false
time_before_logging=5
distance_before_logging=2
accuracy_before_logging=30
keep_fix=true
log_satellite_locations=true
log_network_locations=false
log_passive_locations=false
log_fused_locations=false
altitude_subtractgeoidheight=true
new_file_creation=everystart
new_file_prefix_serial=false
startonapplaunch=true
stoponapplaunch=false
startonbootup=false
autosend_enabled=false
hide_notification_buttons=false
